# Unit tests + syntax check. Runs on every push/PR and is reused by deploy-vps.yml
# so a failing test blocks the VPS deploy.
name: CI

on:
  push:
    branches-ignore: [main, master]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q poller server storage ML scripts env_loader.py

      - name: Unit tests
        # ML/test_hybrid_gate.py is a manual smoke script (mutates app config), not a unittest module.
        run: python -m unittest discover -t . -s . -p "test_*.py" -v
