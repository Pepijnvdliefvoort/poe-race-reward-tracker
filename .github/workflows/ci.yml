# Unit tests + syntax check. Runs on PRs and on pushes to develop (feature branches are tested once,
# via their PR). Reused by deploy-vps.yml and release.yml so a failing test blocks the deploy and the release.
# PRs into main also check that VERSION was bumped.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:

jobs:
  version:
    name: Version is new
    # A release PR into main must bump VERSION: merging it tags that version and creates the GitHub Release.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version has no tag yet
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=VERSION::Set VERSION to X.Y.Z (found '$version')."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error file=VERSION::v$version is already released. Bump VERSION before merging into main."
            exit 1
          fi
          echo "Merging this releases v$version."

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q poller server storage ML scripts env_loader.py

      - name: Unit tests
        run: python -m unittest discover -t . -s . -p "test_*.py" -v
